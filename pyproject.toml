[project]
name = "loomrun"
version = "0.0.1"
description = "Scheduler and governor for one shared inference machine. Sits in front of Ollama or vLLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ranjan G" }]
keywords = ["inference", "ollama", "vllm", "scheduler", "llm", "queue"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
bench = ["httpx>=0.27"]

[project.scripts]
loomrun = "loomrun.cli.main:app"

[project.urls]
Homepage = "https://github.com/ranjan-del/loomrun"
Roadmap = "https://github.com/ranjan-del/loomrun/blob/main/ROADMAP.md"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loomrun"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["loomrun"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
